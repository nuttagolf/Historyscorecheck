<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>หลังร้าน • WASH ME PLS</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#1e2d4a; --orange:#e05a36; --sky:#7bb8e4; --cream:#f8f6ef; --muted:#536480; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--sky); color:var(--navy); font-family:'Kanit',sans-serif; }
    .shell { width:min(1080px,calc(100% - 24px)); margin:0 auto; padding:24px 0 60px; }
    header,.panel,.order { border:3px solid var(--navy); border-radius:18px; background:var(--cream); box-shadow:4px 4px 0 var(--navy); }
    header { padding:18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1,h2,p { margin:0; } h1 { font-size:clamp(20px,5vw,30px); } header p { color:var(--muted); font-size:13px; }
    .panel { padding:18px; margin-top:18px; }
    .login-row,.toolbar,.actions,.return-fields { display:flex; gap:10px; flex-wrap:wrap; }
    input,select,button { min-height:44px; border:2px solid var(--navy); border-radius:12px; padding:9px 12px; font:inherit; }
    input,select { background:#fff; color:var(--navy); min-width:0; }
    #adminToken { flex:1 1 280px; }
    button { background:var(--navy); color:#fff; font-weight:600; cursor:pointer; }
    button.primary { background:var(--orange); } button.light { background:#fff; color:var(--navy); }
    button:disabled { opacity:.55; cursor:wait; }
    .toolbar { align-items:center; justify-content:space-between; }
    .orders { display:grid; gap:14px; margin-top:16px; }
    .order { padding:16px; background:#fff; box-shadow:3px 3px 0 var(--navy); }
    .order-top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .order-number { font-weight:700; } .badge { border-radius:999px; padding:5px 10px; background:#e8f1f8; font-size:12px; font-weight:600; }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 18px; margin:12px 0; font-size:13px; }
    .details span { color:var(--muted); } .error { margin:10px 0; padding:9px; border-radius:10px; background:#fee2e2; color:#991b1b; font-size:12px; }
    .return-fields { margin:10px 0; align-items:end; } .return-fields label { flex:1 1 150px; font-size:12px; } .return-fields input { width:100%; margin-top:4px; }
    #status { min-height:24px; margin-top:10px; color:var(--muted); }
    .hidden { display:none!important; }
    @media(max-width:640px){ .details{grid-template-columns:1fr;} .actions button{flex:1 1 46%;} }
  </style>
</head>
<body>
  <main class="shell">
    <header><div><h1>🧺 WASH ME PLS • หลังร้าน</h1><p>ดูสถานะ จัดคิวคนขับ และยืนยันผ้าเสร็จ</p></div><button id="refreshBtn" class="light hidden">รีเฟรช</button></header>
    <section id="loginPanel" class="panel">
      <h2>เข้าสู่ระบบหลังร้าน</h2>
      <p style="margin:8px 0 14px;color:var(--muted)">ใส่รหัสผู้ดูแลที่ตั้งไว้ใน Cloudflare Worker</p>
      <div class="login-row"><input id="adminToken" type="password" autocomplete="current-password" placeholder="รหัสผู้ดูแล"><button id="loginBtn" class="primary">เข้าสู่ระบบ</button></div>
      <div id="loginStatus" role="status"></div>
    </section>
    <section id="ordersPanel" class="panel hidden">
      <div class="toolbar"><h2>รายการออเดอร์</h2><select id="statusFilter"><option value="">ทุกสถานะ</option><option value="dispatch_pending">รอส่งเข้า Shipday</option><option value="pickup_scheduled">นัดรับแล้ว</option><option value="paid_waiting_dropoff">รอลูกค้านำผ้ามาส่ง</option><option value="received">รับผ้าแล้ว</option><option value="washing">กำลังซัก/อบ</option><option value="ready_for_collection">รอลูกค้ามารับ</option><option value="return_pending">รอจัดส่งคืน</option><option value="return_scheduled">นัดส่งคืนแล้ว</option><option value="completed">เสร็จสมบูรณ์</option></select></div>
      <div id="status" role="status" aria-live="polite"></div>
      <div id="orders" class="orders"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    const API_BASE_URL = String(window.WASH_ME_CONFIG?.apiUrl || '').replace(/\/api\/orders\/?$/, '').replace(/\/$/, '');
    const STATUS_LABELS = {awaiting_payment:'รอชำระเงิน',dispatch_pending:'กำลังจัดคิวคนขับ',pickup_scheduled:'สร้างงานแล้ว • รอคนขับ',driver_assigned:'คนขับรับงานแล้ว',driver_en_route_pickup:'คนขับกำลังไปรับผ้า',picked_up:'รับผ้าจากลูกค้าแล้ว',on_the_way_to_store:'กำลังนำผ้ามาส่งร้าน',paid_waiting_dropoff:'รอลูกค้านำผ้ามาส่ง',received:'ร้านรับผ้าแล้ว',washing:'กำลังซัก/อบ',ready_for_collection:'ผ้าเสร็จ • รอลูกค้ามารับ',return_pending:'กำลังจัดคิวส่งคืน',return_scheduled:'นัดส่งคืนแล้ว',returning:'กำลังส่งผ้าคืนลูกค้า',completed:'เสร็จสมบูรณ์',cancelled:'ยกเลิก',problem:'มีปัญหา'};
    const loginPanel=document.getElementById('loginPanel'),ordersPanel=document.getElementById('ordersPanel'),adminToken=document.getElementById('adminToken'),loginBtn=document.getElementById('loginBtn'),refreshBtn=document.getElementById('refreshBtn'),statusFilter=document.getElementById('statusFilter'),statusEl=document.getElementById('status'),ordersEl=document.getElementById('orders');
    let token='';
    const api=(path,options={})=>fetch(`${API_BASE_URL}${path}`,{...options,headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`,...options.headers}});
    const text=(tag,value,className='')=>{const el=document.createElement(tag);el.textContent=value;el.className=className;return el};
    function detail(grid,label,value){const row=document.createElement('div');row.append(text('span',`${label}: `),document.createTextNode(value||'-'));grid.append(row)}
    async function action(orderNumber,action,body={}){statusEl.textContent='กำลังบันทึก…';const response=await api(`/api/admin/orders/${encodeURIComponent(orderNumber)}/${action}`,{method:'POST',body:JSON.stringify(body)});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||'บันทึกไม่สำเร็จ');await loadOrders()}
    function actionButton(label,handler,className=''){const button=text('button',label,className);button.type='button';button.addEventListener('click',async()=>{button.disabled=true;try{await handler()}catch(error){statusEl.textContent=error.message}finally{button.disabled=false}});return button}
    function todayInBangkok(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
    function renderOrders(orders){ordersEl.replaceChildren();if(!orders.length){ordersEl.textContent='ไม่พบออเดอร์';return}orders.forEach(order=>{const card=document.createElement('article');card.className='order';const top=document.createElement('div');top.className='order-top';top.append(text('div',`${order.orderNumber} • ${order.customerName}`,'order-number'),text('div',STATUS_LABELS[order.orderStatus]||order.orderStatus,'badge'));const grid=document.createElement('div');grid.className='details';detail(grid,'โทร',order.phone);detail(grid,'ยอด',`${order.total} บาท`);detail(grid,'รับผ้า',order.pickupDate?`${order.pickupDate} ${order.pickupTime}`:'ลูกค้านำมาส่ง');detail(grid,'ที่อยู่',order.pickupAddress);detail(grid,'Shipday',order.shipdayStatus);detail(grid,'จำนวนครั้งที่ลอง',String(order.shipdayAttempts||0));card.append(top,grid);if(order.shipdayLastError)card.append(text('div',order.shipdayLastError,'error'));const isPaid=order.paymentStatus==='paid';if(isPaid&&order.returnMode==='driver_return'&&!['return_scheduled','completed','cancelled'].includes(order.orderStatus)){const fields=document.createElement('div');fields.className='return-fields';const dateLabel=text('label','วันส่งคืน');const date=document.createElement('input');date.type='date';date.min=todayInBangkok();dateLabel.append(date);const timeLabel=text('label','เวลาส่งคืน');const time=document.createElement('input');time.type='time';time.min='08:00';time.max='19:00';time.step=1800;timeLabel.append(time);fields.append(dateLabel,timeLabel,actionButton('ผ้าเสร็จ • สร้างงานส่งคืน',()=>{if(!date.value||!time.value)throw new Error('กรุณาเลือกวันและเวลาส่งคืน');return action(order.orderNumber,'ready',{returnDate:date.value,returnTime:time.value})},'primary'));card.append(fields)}const actions=document.createElement('div');actions.className='actions';if(isPaid&&['dispatch_pending','return_pending'].includes(order.orderStatus))actions.append(actionButton('ลอง Shipday ใหม่',()=>action(order.orderNumber,'retry')));if(!['completed','cancelled'].includes(order.orderStatus)){if(isPaid){actions.append(actionButton('รับผ้าแล้ว',()=>action(order.orderNumber,'status',{status:'received'}),'light'),actionButton('กำลังซัก/อบ',()=>action(order.orderNumber,'status',{status:'washing'}),'light'));if(order.returnMode!=='driver_return')actions.append(actionButton('ผ้าเสร็จแล้ว',()=>action(order.orderNumber,'ready'),'primary'));actions.append(actionButton('เสร็จสมบูรณ์',()=>action(order.orderNumber,'status',{status:'completed'})))}actions.append(actionButton('ยกเลิก',()=>action(order.orderNumber,'status',{status:'cancelled'}),'light'))}card.append(actions);ordersEl.append(card)})}
    async function loadOrders(){statusEl.textContent='กำลังโหลด…';const query=statusFilter.value?`?status=${encodeURIComponent(statusFilter.value)}`:'';const response=await api(`/api/admin/orders${query}`);const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||'โหลดออเดอร์ไม่สำเร็จ');renderOrders(result.orders||[]);statusEl.textContent=`ทั้งหมด ${(result.orders||[]).length} ออเดอร์`}
    loginBtn.addEventListener('click',async()=>{token=adminToken.value.trim();if(!token)return;loginBtn.disabled=true;try{await loadOrders();loginPanel.classList.add('hidden');ordersPanel.classList.remove('hidden');refreshBtn.classList.remove('hidden')}catch(error){document.getElementById('loginStatus').textContent=error.message;token=''}finally{loginBtn.disabled=false}});
    refreshBtn.addEventListener('click',()=>loadOrders().catch(error=>statusEl.textContent=error.message));statusFilter.addEventListener('change',()=>loadOrders().catch(error=>statusEl.textContent=error.message));
  </script>
</body>
</html>
