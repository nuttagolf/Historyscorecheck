name: Auto Update Market Prices

on:
  schedule:
    - cron: '0 0 * * *' # รันทุกวันเวลา 07:00 น. ตามเวลาไทย
  workflow_dispatch: # ปุ่มกดสั่งรันเองได้

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push
        run: |
          git config --global user.name "MarketPriceBot"
          git config --global user.email "bot@marketprice.local"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update price data [skip ci]" && git push)
